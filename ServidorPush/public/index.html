<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Push Notification Demo </title>
</head>
<body>

    <h2>Enviar Push</h2>

    <input id="token" placeholder="Token">
    <br><br>

    <input id="title" placeholder="Título">
    <br><br>

    <input id="body" placeholder="Mensaje">
    <br><br>

    <button onclick="enviar()"> Enviar </button>
    
    <script>
        
        async function enviar() {

        await fetch(
            "http://localhost:3000/send",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    
                    token:
                    document.getElementById(
                    "token").value,

                    title:
                    document.getElementById(
                    "title").value,

                    body:
                    document.getElementById(
                    "body").value

                })
            }
        );

        alert("Enviado");
    }

    </script>

</body>
</html>
